<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GARUDA SANKET | Control Center</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --primary: #38bdf8;
            --red: #ef4444;
            --green: #22c55e;
            --yellow: #eab308;
            --accent: #8b5cf6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0 20px 0;
            border-bottom: 1px solid #334155;
            margin-bottom: 20px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #475569;
        }

        .online #status-dot {
            background: var(--green);
            box-shadow: 0 0 10px var(--green);
        }

        .control-card {
            background: var(--card);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 15px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 1px solid #334155;
        }

        h3 {
            margin-top: 0;
            font-size: 0.9rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #334155;
            color: white;
            font-size: 0.9rem;
        }

        button:active {
            transform: scale(0.96);
        }

        button:hover {
            filter: brightness(1.2);
        }

        .btn-start {
            background: var(--primary);
            color: #0f172a;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .btn-lang {
            background: #475569;
        }

        .active-lang {
            border: 2px solid var(--primary);
            background: #1e293b;
        }

        .btn-red {
            background: var(--red);
            grid-column: span 2;
            padding: 20px;
            font-size: 1.1rem;
        }

        .btn-yellow {
            background: var(--yellow);
            color: #000;
        }

        .btn-green {
            background: var(--green);
        }

        .hidden {
            display: none;
        }

        #terminal {
            background: #000;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.75rem;
            color: #10b981;
            height: 100px;
            overflow-y: auto;
            margin-top: 10px;
        }
    </style>
</head>

<body class="offline" id="body-status">
    <div class="container">
        <header>
            <h1 style="margin:0; font-size: 1.5rem;">🦅 GARUDA SANKET</h1>
            <div class="status-badge">
                <div id="status-dot"></div>
                <span id="status-text">SYSTEM OFFLINE</span>
            </div>
        </header>

        <div
            style="font-size: 0.85rem; color: #f8fafc; text-align: center; margin: 0 0 20px 0; padding: 15px; background: rgba(56, 189, 248, 0.1); border-radius: 12px; border: 2px solid var(--primary); box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);">
            <span style="color: var(--primary); font-weight: 800; text-transform: uppercase; letter-spacing: 1px;">⚠️
                IMPORTANT REFERENCE</span><br>
            <p style="margin: 5px 0 0 0; opacity: 0.9;">In production, <b>keypad phones communicate directly with the
                    server</b>. This dashboard is provided solely for visualization and judge reference.</p>
        </div>

        <section class="control-card">
            <h3>1. Initialization</h3>
            <button class="btn-start" onclick="triggerStart()">🚀 START NEW CALL</button>
            <div class="grid">
                <button class="btn-lang" id="btn-en" onclick="setLang('en')">ENGLISH</button>
                <button class="btn-lang" id="btn-kn" onclick="setLang('kn')">ಕನ್ನಡ (KANNADA)</button>
            </div>
        </section>

        <section class="control-card">
            <h3>2. Domain Trigger</h3>
            <div class="grid">
                <button onclick="selectDomain('agriculture')">🌾 AGRICULTURE</button>
                <button onclick="selectDomain('healthcare')">🏥 HEALTHCARE</button>
            </div>
        </section>

        <section id="agri-menu" class="control-card hidden">
            <h3>3. Agri Options</h3>
            <div class="grid">
                <button onclick="triggerAgri('market_price')">📉 MARKET PRICE</button>
                <button onclick="triggerAgri('pest_report')">🐛 PEST REPORT</button>
                <button onclick="triggerAgri('sarkari_help')">📜 SARKARI HELP</button>
                <button onclick="triggerAgri('power_sell')">🤝 POWER SELL</button>
            </div>
        </section>

        <section class="control-card">
            <h3>🚨 EMERGENCY ACTION</h3>
            <div class="grid">
                <button class="btn-red" onclick="triggerEmergency('RED')">🔴 RED: MEDICAL EMERGENCY</button>
                <button class="btn-yellow" onclick="triggerEmergency('YELLOW')">🟡 YELLOW: URGENT</button>
                <button class="btn-green" onclick="triggerEmergency('GREEN')">🟢 GREEN: INFO</button>
            </div>
        </section>

        <div id="terminal">> Waiting for connection...</div>
    </div>

    <script>
        const socket = io();
        const logPanel = document.getElementById('terminal');

        function log(msg) {
            const time = new Date().toLocaleTimeString();
            logPanel.innerHTML += `<div>[${time}] ${msg}</div>`;
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        socket.on('connect', () => {
            document.getElementById('body-status').className = 'online';
            document.getElementById('status-text').innerText = "SYSTEM ONLINE";
            log("Connected to Garuda Sanket Server.");
        });

        socket.on('disconnect', () => {
            document.getElementById('body-status').className = 'offline';
            document.getElementById('status-text').innerText = "SYSTEM OFFLINE";
            log("Disconnected from server.");
        });

        // ACTIONS
        function triggerStart() {
            socket.emit('trigger_start');
            log("Triggered: Welcome Message");
        }

        function setLang(lang) {
            socket.emit('select_language', { lang: lang });
            document.getElementById('btn-en').classList.remove('active-lang');
            document.getElementById('btn-kn').classList.remove('active-lang');
            document.getElementById(`btn-${lang}`).classList.add('active-lang');
            log(`Language set to: ${lang.toUpperCase()}`);
        }

        function selectDomain(domain) {
            if (domain === 'agriculture') {
                document.getElementById('agri-menu').classList.remove('hidden');
            } else {
                document.getElementById('agri-menu').classList.add('hidden');
            }
            socket.emit('select_domain', { domain: domain });
            log(`Domain Selected: ${domain}`);
        }

        function triggerAgri(action) {
            socket.emit('agri_action', { action: action });
            log(`Agri Action: ${action}`);
        }

        function triggerEmergency(level) {
            socket.emit('emergency_trigger', { level: level });
            log(`EMERGENCY: ${level} LEVEL ACTIVATED`);
        }
    </script>
</body>

</html>
